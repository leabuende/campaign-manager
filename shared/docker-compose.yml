services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: campaigns_db

  backend:
    build:
      context: ../backend
      dockerfile: backend.Dockerfile
    container_name: fastapi-backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=campaigns_db
      - UPLOADS_PATH=/app/uploads
      - GEMINI_API_KEY=
    depends_on:
      - mongo

  frontend:
    build:
      context: ../frontend
      dockerfile: frontend.Dockerfile
    container_name: next-frontend
    restart: always
    volumes:
      - uploads_data:/usr/src/app/public/uploads
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8001
      - NEXT_PUBLIC_UPLOADS_PATH=/uploads
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
