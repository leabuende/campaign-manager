version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: campaigns_db

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ../backend
      dockerfile: ../shared/backend.Dockerfile
    container_name: fastapi-backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ../shared/uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=campaigns_db
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=
    depends_on:
      - mongo
      - qdrant

  frontend:
    build:
      context: ../frontend
      dockerfile: ../shared/frontend.Dockerfile
    container_name: next-frontend
    restart: always
    volumes:
      - ../shared/uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  qdrant_storage:
